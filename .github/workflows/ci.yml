name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - run: python -m pip install -c packaging/constraints.txt -e .[dev]
      - run: ruff check .
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - run: python -m pip install -c packaging/constraints.txt .[build]
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import vsteer; print(vsteer.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: Build V-Steer.exe (runs --check)
        run: .\build.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: v-steer-exe
          path: dist/V-Steer.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: v-steer-exe
          path: dist
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a failed upload finds the release already there: just (re)attach the exe.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/V-Steer.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/V-Steer.exe \
              --title "V-Steer $GITHUB_REF_NAME" \
              --notes-file packaging/release-notes.md \
              --generate-notes
          fi
