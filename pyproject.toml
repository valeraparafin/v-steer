[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v-steer"
dynamic = ["version"]
description = "Steer in Zwift with a ThinkRider VS200 thumb remote"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["bleak>=0.22", "zeroconf>=0.130", "pystray>=0.19", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
v-steer = "vsteer.app:main"

[tool.setuptools.dynamic]
version = { attr = "vsteer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/vsteer/zwift/dircon.py"]
